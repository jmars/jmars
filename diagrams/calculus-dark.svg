<svg xmlns="http://www.w3.org/2000/svg" width="880" height="438" viewBox="0 0 880 438" role="img"><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6e7681"/></marker></defs><rect width="880" height="438" fill="#0d1117"/><text x="30" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9198a1" text-anchor="start">THE CARE CALCULUS  ·  the epistemic cycle, typed</text><path d="M 806 126 L 840 126 L 840 62 L 86 62 L 86 96" fill="none" stroke="#6cb0ff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#h)"/><text x="508" y="56" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#6cb0ff" text-anchor="middle">feedback  K → A → K</text><rect x="30" y="96" width="112" height="60" rx="8" fill="#161b22" stroke="#30363d"/><text x="86" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">knower  K</text><text x="86" y="141" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">cartesian</text><path d="M 142 126 L 196 126" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#h)"/><text x="169" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#6cb0ff" text-anchor="middle">gen</text><rect x="196" y="96" width="210" height="60" rx="8" fill="#161b22" stroke="#30363d"/><text x="301" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">content ⊗ K</text><text x="301" y="141" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">content is linear; K is not</text><path d="M 406 126 L 462 126" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#h)"/><text x="434" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#6cb0ff" text-anchor="middle">cons</text><rect x="462" y="96" width="152" height="60" rx="8" fill="#161b22" stroke="#30363d"/><text x="538" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">stream</text><text x="538" y="141" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">one tick per unroll</text><path d="M 614 126 L 676 126" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#h)"/><text x="645" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#6cb0ff" text-anchor="middle">red</text><rect x="676" y="96" width="130" height="60" rx="8" fill="#161b22" stroke="#30363d"/><text x="741" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">A</text><text x="741" y="141" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">knowledge</text><path d="M 538 156 L 538 214" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#h)"/><text x="548" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#6cb0ff" text-anchor="start">obj</text><rect x="462" y="214" width="152" height="56" rx="8" fill="#161b22" stroke="#30363d"/><text x="538" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">value</text><text x="538" y="256" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">the objective&#x27;s domain</text><path d="M 86 156 L 86 214" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#h)"/><text x="96" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#ff7b72" text-anchor="start">terminate</text><rect x="30" y="214" width="174" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/><text x="117" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">trace</text><text x="117" y="256" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">inert — nothing consumes it</text><text x="30" y="300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start">the two laws of the grammar:</text><text x="30" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start">content  →  content ⊗ content</text><path d="M 293 318 L 307 332 M 307 318 L 293 332" stroke="#ff7b72" stroke-width="2.4" stroke-linecap="round" fill="none"/><text x="322" y="330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start">no contraction — untypable</text><text x="30" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start">content  →  unit</text><path d="M 179 348 L 193 362 M 193 348 L 179 362" stroke="#ff7b72" stroke-width="2.4" stroke-linecap="round" fill="none"/><text x="208" y="360" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e6edf3" text-anchor="start">no vanishing — untypable</text><text x="30" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">But a token may be archived: snoc into a trace — counted, spent, never reduced.</text><text x="30" y="416" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">That is the one legal sink, and it is the not-heard failure.</text></svg>
