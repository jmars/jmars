<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img"><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6e7681"/></marker></defs><rect width="980" height="330" fill="#0d1117"/><text x="30" y="44" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start">WHAT THE THEOREMS SAY  ·  the chain either reaches a knower or it does not</text><rect x="30" y="84" width="150" height="56" rx="8" fill="#161b22" stroke="#30363d"/><text x="105" y="108" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">objective</text><text x="105" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">f : stream → value</text><path d="M 180 112 L 244 112" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#h)"/><text x="212" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">consumes</text><rect x="244" y="84" width="150" height="56" rx="8" fill="#161b22" stroke="#30363d"/><text x="319" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">content</text><text x="319" y="127" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">linear — spent once</text><path d="M 394 112 L 458 112" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#h)"/><text x="426" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, s