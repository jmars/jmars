if, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">linear — spent once</text><path d="M 394 242 L 458 242" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#h)"/><text x="426" y="232" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">produced by</text><rect x="458" y="214" width="210" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/><text x="563" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">∅  no knower</text><text x="563" y="257" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">diagnostic claim</text><path d="M 665 235 L 679 249 M 679 235 L 665 249" stroke="#ff7b72" stroke-width="2.4" stroke-linecap="round" fill="none"/><text x="692" y="247" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#ff7b72" text-anchor="start">nothing protective derivable</text><text x="30" y="300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Imposing protection from outside is the case the second line describes: the constraint is not in the chain, so it is the first thing optimization removes.</text></svg>
